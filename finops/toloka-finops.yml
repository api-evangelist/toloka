description: >-
  FinOps view of Toloka spend. Toloka cost is driven by human-data work:
  requesters pay a reward per completed assignment (task suite) at a rate they
  set per pool, multiplied by overlap and task volume, plus platform commission
  and any bonuses issued to Tolokers. Managed human-data engagements are billed
  per contract. Per-assignment rewards, commission rates, and managed-service
  pricing are not publicly listed and are not reconciled in this artifact.
notes: >-
  Total spend is highly sensitive to overlap and pool configuration; modeling
  cost = tasks x overlap x reward + commission + bonuses is the primary lever.
  Verify commission and managed pricing with Toloka sales during reconciliation.
