meters:
- name: assignment_rewards
  description: Reward paid per completed assignment (task suite), at the per-pool rate.
  unit: assignments
  aggregation: sum
  dimensions:
  - account
  - project
  - pool
- name: platform_commission
  description: Toloka commission applied on top of rewards paid to Tolokers.
  unit: assignments
  aggregation: sum
  dimensions:
  - account
  - pool
- name: bonuses
  description: Discretionary bonuses issued to Tolokers via the User Bonuses API.
  unit: bonuses
  aggregation: sum
  dimensions:
  - account
  - pool
  - user
- name: managed_engagement
  description: Sales-led managed human-data engagement billed per contract.
  unit: contracts
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Pull Toloka balance and pool-level spend; inspect reward x overlap x task-volume burn per pool.
- name: Allocation
  description: Tag projects and pools to teams/workloads; map prepaid balance draws to cost centers.
- name: Optimization
  description: Tune overlap and dynamic overlap, use training pools and skills to cut rework, and reserve bonuses for high-value Tolokers.
- name: Accountability
  description: Assign owners per project/pool; review reward and bonus spend against budget before opening pools.
