aid: toloka
url: https://raw.githubusercontent.com/api-evangelist/toloka/refs/heads/main/apis.yml
name: Toloka
kind: company
description: Toloka is a data-labeling and human-data platform that powers human-in-the-loop
  pipelines for training and evaluating AI. The Toloka API lets requesters programmatically
  create projects, configure pools of crowdsourced tasks, upload tasks and task suites,
  collect and review Toloker responses, and track asynchronous operations, with a
  companion toloka-kit Python SDK.
